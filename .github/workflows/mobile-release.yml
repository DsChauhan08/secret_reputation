name: Mobile Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to upload assets to (defaults to latest release)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: mobile-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

# ─── shared setup ────────────────────────────────────────────────────────────

jobs:
  setup:
    name: Validate & sync EAS environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_WS_URL: ${{ secrets.EXPO_PUBLIC_WS_URL }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi

          if [ -z "$release_tag" ] || [ "$release_tag" = "null" ]; then
            echo "Could not determine release tag. Provide workflow_dispatch input 'release_tag'." >&2
            exit 1
          fi

          gh release view "$release_tag" > /dev/null

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate EAS token
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN is not set. Add it as a repository secret." >&2
            exit 1
          fi

          bun x eas-cli --version
          bun x eas-cli whoami --non-interactive

      - name: Sync EAS env vars (production)
        shell: bash
        run: |
          set -euo pipefail

          upsert_env() {
            local name="$1"
            local value="$2"
            local visibility="$3"

            if [ -z "$value" ]; then
              echo "Skipping empty var: $name"
              return
            fi

            bun x eas-cli env:create \
              --non-interactive \
              --scope project \
              --environment production \
              --name "$name" \
              --value "$value" \
              --visibility "$visibility" \
              --force
          }

          upsert_env "EXPO_PUBLIC_WS_URL" "${EXPO_PUBLIC_WS_URL}" plaintext
          upsert_env "EXPO_PUBLIC_POSTHOG_KEY" "${EXPO_PUBLIC_POSTHOG_KEY}" sensitive
          upsert_env "EXPO_PUBLIC_POSTHOG_HOST" "${EXPO_PUBLIC_POSTHOG_HOST}" plaintext
          upsert_env "EXPO_PUBLIC_APP_ENV" "production" plaintext

# ─── Android AAB ─────────────────────────────────────────────────────────────

  android-aab:
    name: Build Android AAB
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build AAB
        shell: bash
        env:
          TAG_NAME: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          bun x eas-cli build \
            --platform android \
            --profile production \
            --message "GitHub release ${TAG_NAME}" \
            --non-interactive \
            --wait \
            --json > eas-build-aab.json

      - name: Download & upload AAB
        shell: bash
        env:
          TAG_NAME: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          artifact_url="$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' eas-build-aab.json)"

          if [ -z "$artifact_url" ] || [ "$artifact_url" = "null" ]; then
            echo "Unable to resolve AAB artifact URL." >&2
            cat eas-build-aab.json
            exit 1
          fi

          mkdir -p ../../release-assets
          aab_name="secret-reputation-${TAG_NAME}.aab"
          curl -fL "$artifact_url" -o "../../release-assets/${aab_name}"

          if [ ! -s "../../release-assets/${aab_name}" ]; then
            echo "Downloaded AAB is empty or missing." >&2
            exit 1
          fi

          cd ../..
          gh release upload "${TAG_NAME}" "release-assets/${aab_name}" --clobber

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-aab-${{ github.run_id }}
          path: apps/mobile/eas-build-aab.json

# ─── Android APK ─────────────────────────────────────────────────────────────

  android-apk:
    name: Build Android APK
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build APK
        shell: bash
        env:
          TAG_NAME: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          bun x eas-cli build \
            --platform android \
            --profile production-apk \
            --message "GitHub release ${TAG_NAME} APK" \
            --non-interactive \
            --wait \
            --json > eas-build-apk.json

      - name: Download & upload APK
        shell: bash
        env:
          TAG_NAME: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          artifact_url="$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' eas-build-apk.json)"

          if [ -z "$artifact_url" ] || [ "$artifact_url" = "null" ]; then
            echo "Unable to resolve APK artifact URL." >&2
            cat eas-build-apk.json
            exit 1
          fi

          mkdir -p ../../release-assets
          apk_name="secret-reputation-${TAG_NAME}.apk"
          curl -fL "$artifact_url" -o "../../release-assets/${apk_name}"

          if [ ! -s "../../release-assets/${apk_name}" ]; then
            echo "Downloaded APK is empty or missing." >&2
            exit 1
          fi

          cd ../..
          gh release upload "${TAG_NAME}" "release-assets/${apk_name}" --clobber

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-apk-${{ github.run_id }}
          path: apps/mobile/eas-build-apk.json

# ─── iOS IPA ─────────────────────────────────────────────────────────────────

  ios-ipa:
    name: Build iOS IPA
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build IPA
        shell: bash
        env:
          TAG_NAME: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          bun x eas-cli build \
            --platform ios \
            --profile production \
            --message "GitHub release ${TAG_NAME} IPA" \
            --non-interactive \
            --wait \
            --json > eas-build-ipa.json

      - name: Download & upload IPA
        shell: bash
        env:
          TAG_NAME: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          artifact_url="$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' eas-build-ipa.json)"

          if [ -z "$artifact_url" ] || [ "$artifact_url" = "null" ]; then
            echo "Unable to resolve IPA artifact URL." >&2
            cat eas-build-ipa.json
            exit 1
          fi

          mkdir -p ../../release-assets
          ipa_name="secret-reputation-${TAG_NAME}.ipa"
          curl -fL "$artifact_url" -o "../../release-assets/${ipa_name}"

          if [ ! -s "../../release-assets/${ipa_name}" ]; then
            echo "Downloaded IPA is empty or missing." >&2
            exit 1
          fi

          cd ../..
          gh release upload "${TAG_NAME}" "release-assets/${ipa_name}" --clobber

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-ipa-${{ github.run_id }}
          path: apps/mobile/eas-build-ipa.json

# ─── Summary ─────────────────────────────────────────────────────────────────

  summary:
    name: Release summary
    needs: [setup, android-aab, android-apk, ios-ipa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Mobile release pipeline completed"
            echo "- Release tag: \`${{ needs.setup.outputs.release_tag }}\`"
            echo ""
            echo "| Artifact | Job Status |"
            echo "|----------|------------|"
            echo "| Android AAB (.aab) | \`${{ needs.android-aab.result }}\` |"
            echo "| Android APK (.apk) | \`${{ needs.android-apk.result }}\` |"
            echo "| iOS IPA (.ipa) | \`${{ needs.ios-ipa.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
